project: piper_studio
kind: ros
owner: ros/piper_studio
docs: [README.md, AGENTS.md, docs/CLEANUP.md]
artifacts:
  - id: piper-studio-home
    pin: 6
    type: web
    title: Piper Studio home
    desc: "The base page of Piper Studio: every Studio page under one roof with a live running/not-running status and the command to start it, the pages of projects built on Studio, the tools to run from a terminal, and the key documents. Generated from this file by tools/home/build_home.py."
    group: Experiments
    runtime: static
    workdir: ~/data/ml/isaac/piper_studio/home
    start: /usr/bin/python3 -m http.server --bind 127.0.0.1 8783
    port: 8783
    exposure: tailnet
    route: /piper-studio
    autostart: true
    unit: web-piper-studio-home.service
    unit_scope: user
    manage: "web-pages restart piper-studio-home"
    probe: {path: /}
    notes: "Static, no GPU, no recordings. Rebuild after registering a page or tool: python tools/home/build_home.py (ROS env)."
    links:
      - {label: Open Studio home, local: "http://localhost:8783/", tailnet: "https://{ts}:8700/piper-studio/"}
  - id: piper-demo
    pin: 7
    type: web
    title: Piper Studio demo
    desc: "AgileX Piper in simulation: the same scripted sequence on mock, Gazebo, MuJoCo and Isaac Sim through one set of controllers; videos, step results, cross-backend agreement. Real arm not involved."
    group: Experiments
    runtime: static
    workdir: ~/data/ml/isaac/piper_studio/site
    start: /usr/bin/python3 -m http.server --bind 127.0.0.1 8780
    port: 8780
    exposure: tailnet
    route: /piper-studio/demo
    autostart: true
    unit: web-piper-studio-demo.service
    unit_scope: user
    manage: "web-pages restart piper-studio-demo"
    probe: {path: /}
    notes: "Built by tools/demo/build_demo_page.py from recorded demo runs; files in ~/data/ml/isaac/piper_studio/site."
    links:
      - {label: Open demo, local: "http://localhost:8780/", tailnet: "https://{ts}:8700/piper-studio/demo/"}
  - id: piper-model-viewer
    type: web
    title: Piper Studio model viewer
    desc: "3D view of the Piper description as the stack builds it (live from the xacro): visual (with opacity slider) and collision shapes, every frame with its own axes and name toggle, pose of any frame in any other (for measuring against CAD), joint sliders with limits, named poses, link masses and collision pairs, cameras (ZED X Mini on the own bracket) with their versioned calibrations and a compare-with overlay. Independent of any other viewer."
    group: Experiments
    runtime: python-server
    workdir: .
    start: scripts/viewer.sh start
    stop: scripts/viewer.sh stop
    port: 8781
    bind: loopback
    exposure: tailnet
    route: /piper-studio/viewer
    autostart: false
    data: none
    probe: {path: /}
    links:
      - {label: Open viewer, local: "http://localhost:8781/", tailnet: "https://{ts}:8700/piper-studio/viewer/"}
    ops_notes: "Loopback only; the :8700 gateway route is the tailnet exposure. Serves only .stl/.dae files under the piper_studio workspace. Three.js is loaded by the browser from cdn.jsdelivr.net (pinned 0.160.0); nothing is installed on this machine."
  - id: piper-curobo-viewer
    type: web
    title: Piper cuRobo model viewer
    desc: "3D view of the cuRobo collision-sphere models Piper Studio ships (piper_assets.curobo_model): the arm with the ZED X Mini on its bracket and the robot only, spheres per link with live self-collision highlight, joint sliders, the named poses zero and ready, URDF meshes, and whether the model is current for the description. Needs no cuRobo."
    group: Experiments
    runtime: python-server
    workdir: .
    start: scripts/curobo_viewer.sh start
    stop: scripts/curobo_viewer.sh stop
    port: 8782
    bind: loopback
    exposure: tailnet
    route: /piper-studio/curobo
    autostart: false
    data: none
    probe: {path: /}
    links:
      - {label: Open viewer, local: "http://localhost:8782/", tailnet: "https://{ts}:8700/piper-studio/curobo/"}
    ops_notes: "Loopback only; the :8700 gateway route is the tailnet exposure. Serves only .stl/.dae files under the piper_assets data directory. Three.js is loaded by the browser from cdn.jsdelivr.net; nothing is installed on this machine."
  - id: piper-curobo-regenerate
    type: job
    title: Regenerate the cuRobo Piper models (optional)
    desc: "tools/curobo/build_model.py: builder, sphere fit (policy.yaml), finalize, mesh-coverage check and planning validation for the robot only and the ZED X Mini model; writes src/piper_description/config/curobo/. Needs the optional cuRobo environment (scripts/curobo_env.sh setup, about 7 GB) and the GPU; only for changing the description or the policy. Nothing moves a robot."
    runtime: one-shot
    workdir: .
    start: scripts/curobo_env.sh run tools/curobo/build_model.py
    stop: null
    port: 0
    route: null
    autostart: false
    exposure: loopback
    data: none
    needs: [gpu]
    notes: "Run tools/release/build_assets.py first (after a description change) and again afterwards; then python -m pytest src/piper_assets (staleness and consistency tests). docs/CUROBO.md."
  - id: piper-run-demo
    type: job
    title: Run the scripted demo on one backend
    desc: "piper_py.demo on one backend and store the record. Backend mock|gazebo|mujoco|isaac; GPU only for isaac."
    runtime: one-shot
    workdir: .
    start: scripts/run_demo.sh BACKEND OUTDIR [ROS_DOMAIN_ID] [MODE]
    notes: "ROS_DOMAIN_ID range for Piper: 70-161."
  - id: piper-build-demo-page
    type: job
    title: Build the static demo page
    desc: Builds the demo page from recorded demo runs (scripts/run_demo.sh).
    runtime: one-shot
    workdir: .
    start: python tools/demo/build_demo_page.py
  - id: piper-bootstrap
    type: job
    title: Rebuild the workspace from a clean clone
    desc: Installs only inside the workspace; reports missing system packages.
    runtime: one-shot
    workdir: .
    start: scripts/bootstrap.sh
  - id: piper-isaac-gui
    type: job
    title: Interactive Piper in the full Isaac Sim editor
    desc: "ROS-free interactive session; needs the four Piper wheels, Isaac environment, GPU and an NVIDIA-capable display. Ctrl-D stops it."
    runtime: one-shot
    workdir: .
    start: python -m piper_isaac --gui --scene table
    data: none
    notes: "PiperIsaacSim starts a private server through gpu-run; local unix socket only, no TCP port. DISPLAY and XAUTHORITY are forwarded."
  - id: piper-isaac-benchmark
    type: job
    title: Benchmark Isaac physics and recording
    desc: "Compare plain, render-enabled and recording modes with one trajectory; needs the Piper wheels and Isaac GPU environment."
    runtime: one-shot
    workdir: .
    start: python isaac/bench_step.py --seconds 4
    data: none
  - id: piper-arm
    type: cli
    title: piper-arm, the real-arm cockpit
    desc: "One terminal console for the real Piper: live status and one key per action (start, poses, jog, gripper, end session, e = emergency stop). Needs CAN up (scripts/can_up.sh, sudo) and the user at the arm."
    runtime: one-shot
    workdir: .
    start: piper-arm
    needs: ["hardware:piper-01"]
    notes: "Venv: source scripts/env.sh. One program drives the arm at a time (bus lock)."
  - id: piper-arm-stop
    type: cli
    title: Emergency stop of the real arm
    desc: "tools/real_arm/arm_stop.py: electronic e-stop (default), --disable (motors off), --reset (clear). Works beside a running tool (skips the bus lock)."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/arm_stop.py
    needs: ["hardware:piper-01"]
  - id: piper-arm-session
    type: cli
    title: Start / end a real-arm session
    desc: "tools/real_arm/arm_session.py status|start|stop: clear an e-stop, motors on, move to zero; zero, park, e-stop, clear."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/arm_session.py status
    needs: ["hardware:piper-01"]
  - id: piper-arm-info
    type: cli
    title: Read-only status of the real arm
    desc: "tools/real_arm/arm_info.py: role, mode, motors, faults, firmware, limits, drivers, gripper; saves a JSON read-out. Sends queries only."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/arm_info.py --arm-id piper-01
    needs: ["hardware:piper-01"]
  - id: piper-realarm-smoke
    type: job
    title: RealArm smoke test on the real arm
    desc: "tools/real_arm/realarm_smoke.py: start, guard refusals, a 5 deg move, a 25 ms cosine, gripper, abort, stop; an Enter before each stage. User at the arm."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/realarm_smoke.py
    needs: ["hardware:piper-01"]
  - id: piper-stream-test
    type: job
    title: Measure 25 ms streaming on the real arm
    desc: "tools/real_arm/arm_stream_test.py: tracking error, lag, timing and speed against the speed percent for a known one-joint plan; --offline prints the plan without the arm."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/arm_stream_test.py --offline
    needs: ["hardware:piper-01"]
  - id: piper-gripper-test
    type: job
    title: Gripper measurements on the real arm
    desc: "tools/real_arm/gripper_test.py empty|force|object|slip: widths, times, force read-back, creep and slip. User at the arm; the gripper moves only while the arm is started."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/gripper_test.py empty
    needs: ["hardware:piper-01"]
  - id: piper-curobo-scenario-plan
    type: job
    title: Plan the cuRobo test scenario
    desc: "tools/real_arm/curobo_plan_scenario.py: approach, grasp, lift, home from zero with the cuRobo study's planner (its own venv); writes scenario.json. No arm."
    runtime: one-shot
    workdir: .
    start: gpu-run ~/projects/ml_tests/experiments/curobo_piper_study/.venv/bin/python tools/real_arm/curobo_plan_scenario.py
    needs: [gpu]
  - id: piper-run-scenario
    type: job
    title: Run the cuRobo scenario on a backend
    desc: "tools/real_arm/run_scenario.py SCENARIO --backend real|ros|mujoco (--dry-run needs none): slowed to 0.3 rad/s, an Enter per step on the arm. A stored plan is in tools/real_arm/fixtures/."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/run_scenario.py tools/real_arm/fixtures/scenario_pick_25_0_05.json --dry-run
  - id: piper-dead-process-drill
    type: job
    title: Dead-process drill
    desc: "tools/real_arm/dead_process_drill.py hold|moving: what the arm does when the program driving it is killed. User at the arm."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/dead_process_drill.py hold
    needs: ["hardware:piper-01"]
  - id: piper-fk-compare
    type: job
    title: Our model against the firmware kinematics
    desc: "tools/real_arm/fk_compare.py [--arm]: URDF vs SDK modified-DH forward kinematics (offline), optionally against the pose the arm reports."
    runtime: one-shot
    workdir: .
    start: python tools/real_arm/fk_compare.py
