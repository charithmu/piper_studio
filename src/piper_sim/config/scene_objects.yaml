# Static objects in front of the arm, shared by every simulator (Gazebo, MuJoCo, Isaac) so camera views are comparable.
# Frame: base_link (= world). Colours are distinct so detection tests can tell them apart.
objects:
  - {name: cube_red,      shape: box,      size: [0.04, 0.04, 0.04],  pos: [0.30,  0.06, 0.02], rgba: [0.85, 0.10, 0.10, 1.0]}
  - {name: cube_green,    shape: box,      size: [0.04, 0.04, 0.04],  pos: [0.24, -0.08, 0.02], rgba: [0.10, 0.65, 0.15, 1.0]}
  - {name: cylinder_blue, shape: cylinder, size: [0.025, 0.06],       pos: [0.36, -0.05, 0.03], rgba: [0.10, 0.25, 0.85, 1.0]}  # radius, height

# Placeholder table for planners and the MuJoCo "table" scene: UNMEASURED (not the user's real table). The arm base sits at the origin;
# top_z is the height of the table surface in base_link (the cubes above sit on z = 0). Replace with measured values when they exist.
table:
  {name: table, size: [1.4, 1.4, 0.05], top_z: 0.0, pos_xy: [0.0, 0.0], measured: false}
