[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper_assets"
version = "0.6.0"
description = "The AgileX Piper arm as data: flat URDFs, meshes, SRDF, limits with their sources, scene. No ROS needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "piper_core>=0.6.0"]

[tool.setuptools]
packages = ["piper_assets"]
include-package-data = true

[tool.setuptools.package-data]
piper_assets = ["data/**/*"]
