  # z = 0.040 is a rough guess (user: "around 4 cm", NOT YET MEASURED): the distance from gripper_base's origin to the middle of the ring.
  xyz: [0.0, 0.0, 0.040]
  rpy: [1.5707963, 0.0, -1.5707963]
