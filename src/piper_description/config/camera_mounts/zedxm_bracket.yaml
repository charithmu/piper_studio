  # position: the point measured in Fusion (0, -13.686, +91.71 mm from the ring origin), ASSUMED to be the middle of the front glass.
  # orientation: viewing direction = Fusion (0, +0.94, -0.34), i.e. towards the fingers and tilted 20 deg towards the gripper axis, as the cradle's tilted faces say;
