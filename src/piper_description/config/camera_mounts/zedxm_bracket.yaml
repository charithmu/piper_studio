# ZED X Mini on the user's own clamp bracket (Fusion design, meshes/zedxm_bracket.stl): VERSION 2 (2026-11-11), from the user's measurements in Fusion, not yet checked on the arm.
# Bracket frame (= mesh origin, camera_mount_link) = the user's UCS at the gripper base: the mesh is expressed in that UCS (tools/build_zedxm_bracket_mesh.py), so the translation
# to gripper_base is zero. UCS axes (they equal the Fusion world axes to 0.174 deg): Y = the gripper axis, towards the fingers; Z = along the camera arm; X = Y x Z.
# Camera frame (zed_camera_link, Stereolabs' camera_link = the camera's bottom mounting hole): x forward (viewing direction), y left, z up.
stand_in_gripper_base:        # the bracket frame in gripper_base; xyz in metres, rpy in radians
  # UCS Y -> gripper z (to the fingers), UCS Z -> gripper -x (camera on the -x side, like the AgileX stand; the user has not confirmed the side), UCS X -> gripper -y.
  xyz: [0.0, 0.0, 0.0]
  rpy: [1.5707963, 0.0, -1.5707963]
camera_in_stand:              # zed_camera_link in the bracket frame
  # position: the user's Measure result, selection 1 = the UCS at the gripper base, selection 2 = the camera's mounting hole: UCS delta (0, 16.036, 91.759) mm, 93.15 mm apart.
  xyz: [0.0, 0.016036, 0.091759]
  # orientation: viewing direction = (0, +cos t, -sin t), up = the seat's normal (0, +sin t, +cos t), with t = 19.826 deg = the seat's 20.000 deg in the Fusion world axes
  # (STEP and STL agree) minus the UCS's 0.174 deg. The user's 70.00 deg measure is the seat normal against the ring axis in the Fusion world axes (70.0012 deg in the STEP); in the UCS axes it is 70.17 deg.
  rpy: [0.0, 0.346029, 1.570796]
measured: null                # for a real calibration: {date: "2026-..", by: "..", method: "caliper | hand-eye (board, solver)", error_mm: ..}
