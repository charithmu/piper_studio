# Wrist camera on AgileX's mid stand: the NOMINAL poses (the one place these numbers live).
# Source: AgileX agx_arm_sim `piper_girpper_D435.urdf` (MIT), applied to `gripper_base` (stand clamped to the gripper body; user decision 2026-11-08, CLEANUP C5).
# Not measured on our arm. To use a measured pose, copy this file next to it under another name, edit the numbers and fill in `measured`, then
# pass camera_calibration:=<name> (or a full path) to the launch files / xacro / export_urdf.py. docs/description/DECISIONS.md D11, CLEANUP C9.
stand_in_gripper_base:        # the stand mount frame (camera_mount_link) in gripper_base; xyz in metres, rpy in radians
  xyz: [-0.034, -0.001, 0.022]
  rpy: [0.0, 0.0, 0.0]
camera_in_stand:              # the D435 body (bottom screw frame) in the stand frame
  xyz: [-0.031, -0.028, 0.0018]
  rpy: [0.0, -1.22, 0.0]
measured: null                # for a real calibration: {date: "2026-..", by: "..", method: "caliper | hand-eye (board, solver)", error_mm: ..}
