# ZED X Mini on the user's own clamp bracket (Fusion design): VERSION 3 (2026-11-11), from the user's re-export `Camera_Mount_originatgripperbase.stl` (kept in
# ~/data/ml/cad_downloads/zedxm/zedxm_mount_v3_at_gripper_base_mm.stl) and his Fusion measures. Not yet checked on the arm.
# The file is in Fusion's WORLD coordinates, not at the gripper base (bounds x -45.7..42.3, y 336.4..392.4, z 393.5..554.4 mm), where the user's UCS at the gripper base is
# (-1.417, 346.252, 426.014). The only processing: that origin subtracted and mm -> m (tools/build_zedxm_bracket_mesh.py --offset-mm 1.417 -346.252 -426.014); no rotation, so the
# mesh stays in the Fusion world axes (v2 also rotated by the UCS's 0.174 deg). Same bracket as v1/v2 (registered: <0.5 mm, 0.05 deg).
# Bracket frame (= mesh origin, camera_mount_link) = the gripper base origin. Axes (Fusion world): Y = the gripper axis, towards the fingers; Z = along the camera arm; X = Y x Z.
# Camera frame (zed_camera_link, Stereolabs' camera_link = the camera's bottom mounting hole): x forward (viewing direction), y left, z up.
mesh: zedxm_bracket_v3.stl                # in meshes/; collision: zedxm_bracket_v3_collision.stl; metres, in the frame below
stand_in_gripper_base:        # the bracket frame in gripper_base; xyz in metres, rpy in radians
  # Y -> gripper z (to the fingers), Z -> gripper -x (camera on the -x side, like the AgileX stand; the user has not confirmed the side), X -> gripper -y.
  xyz: [0.0, 0.0, 0.0]
  rpy: [1.5707963, 0.0, -1.5707963]
camera_in_stand:              # zed_camera_link in the bracket frame
  # position: the user's camera mounting hole, Fusion world (-1.417, 362.566, 517.724) minus the UCS origin = (0, 16.314, 91.710) mm (93.15 mm); it lies 0.44 mm from the seat plane of this mesh.
  xyz: [0.0, 0.016314, 0.09171]
  # orientation: viewing direction = (0, +cos 20, -sin 20), up = the seat normal (0, +sin 20, +cos 20): the seat is 20.000 deg from Z in the STEP and in this mesh (70.00 deg to the ring axis, as measured).
  rpy: [0.0, 0.349066, 1.570796]
measured: null                # for a real calibration: {date: "2026-..", by: "..", method: "caliper | hand-eye (board, solver)", error_mm: ..}
