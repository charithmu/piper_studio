# The Go2 carrying the Piper: the numbers that are NOT in the Go2's own description. One file, read by the xacro (urdf/go2_piper.urdf.xacro),
# piper_description.go2 and tools/go2_cover; nothing else in the repo restates them.
stand_pose:                     # the standing posture the dog's cover is generated for (all four legs; static)
  hip: 0.0
  thigh: 0.8
  calf: -1.5
stand_source: "go2_studio src/go2_studio/robot.py STAND (= unitree_rl_mjlab FixStand); the Go2 stands on the floor in it"
mount:
  nominal: true                 # plate thickness was measured by touch by the user (2026-11-12); the arm base was then put on the Go2 base z axis (2026-11-13); plate length/width, yaw and payload are still estimates
  plate_xyz: [0.0, 0.0, 0.084]      # plate centre in the Go2 `base` frame; x = 0, y = 0: the arm's base_link z axis is the Go2 base z axis (user, 2026-11-13; it was 4 cm behind); z = the top of the body shell under the plate footprint (0.0615 at x = 0, from base.dae) + half the thickness
  plate_size: [0.14, 0.09, 0.045]   # thickness 45 mm (user, by touch); length and width are estimates. The arm base then stands at z = 0.1065, about 17 mm above the dog's box top (the shoulder hump, z = 0.0893)
  mount_rpy: [0.0, 0.0, 0.0]    # arm base orientation on the plate: yaw 0 = the arm's x axis points forward
  payload_boxes: []             # other things fixed on the dog (the ZED Box Mini, a battery, a cable guide...), each {name, size: [x, y, z], xyz: [x, y, z], rpy: [r, p, y]} in the Go2 `base` frame (axis-aligned unless rpy);
                                # user estimates, none given yet. They become boxes of the planner's world next to the dog and the plate (piper_description.go2_world)
