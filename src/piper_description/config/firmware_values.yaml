# Values reported by the arm's own firmware win over the vendor URDF where the two differ (user decision, 2026-11-08).
# piper_arm_macro.py applies them when it generates urdf/piper_arm.xacro and the SRDF, and `check` compares the macro with
# the official model plus exactly these overrides. `python tools/piper_arm_macro.py report` lists every difference from the
# vendor files. A test compares this file with the arm's saved read-out.
#
# source:   docs/real_arm/arms/piper-01.readout.json (tools/real_arm/arm_info.py, read-only), firmware S-V1.9-1, 2026-10-14,
#           after the upgrade to the latest firmware the arm supports and the user's calibration
# not in the firmware: link masses and inertias (URDF/CAD, unmeasured)
# NOT firmware-reported, but arm-specific: arm_joint_max_effort is the SDK's move_mit feed-forward torque range at firmware >= S-V1.8-8
# (pyAgxArm docs/piper/firmware_reference.md: +-16 N.m for c = 1, joints 1-3; +-16 x 0.813252 for joints 4-6). It is a command encoding
# range, an upper bound and NOT a motor rating; it replaces the vendor placeholder of 100 N.m.
arm_joint_max_velocity: 3.0    # rad/s, joints 1-6 (firmware max_joint_spd; vendor URDF: 5)
arm_joint_max_effort: [16.0, 16.0, 16.0, 13.012, 13.012, 13.012]   # N.m, joints 1-6 (SDK MIT range; vendor URDF: 100)
gripper_stroke: 0.07           # m, gripper opening (firmware max_range_config; vendor URDF: 0.1)
# NOT firmware-reported, vendor/measured gripper numbers that replace the vendor URDF's placeholders (effort 10, velocity 3 on a prismatic joint):
gripper_max_effort: 3.0        # N, the vendor wrapper's command ceiling (agx_arm_ctrl AgxGripperWrapper.FORCE_MAX, command range 0.5 to 3.0 N; the same cap as piper_core.GRIPPER_MAX_EFFORT)
gripper_max_velocity: 0.25     # m/s of the opening width, measured: 68 mm in 0.28 s to within 1 mm, 15 closes and opens (docs/real_arm/REPORT.md section 4). Read by actuation.yaml's consumers (the simulators), NOT written into the URDF limit: Gazebo's gripper fails with it (test_7_gripper)
