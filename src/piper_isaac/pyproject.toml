[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper_isaac"
version = "0.4.0"
description = "The Piper arm in Isaac Sim without ROS: PiperIsaacSim, an ArmBackend that runs planner trajectories through the same rules as the real arm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "piper_core>=0.3.0", "piper_assets>=0.3.0"]

[tool.setuptools]
packages = ["piper_isaac"]
include-package-data = true

[tool.setuptools.package-data]
piper_isaac = ["runner/*.py", "data/**/*"]
